name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we reproduce this?
      placeholder: |
        1. Run `edgetpu-exporter` with ...
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error output or logs.
    validations:
      required: true

  - type: dropdown
    id: device_type
    attributes:
      label: EdgeTPU device type
      options:
        - PCIe (Apex / Coral M.2 / mPCIe)
        - USB (Coral USB Accelerator)
        - Coral Dev Board
        - Other / Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Image / version
      description: Docker image tag or git commit SHA
      placeholder: "justsky/edgetpu-exporter:latest or git SHA"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel version, Kubernetes version (if applicable)
      placeholder: |
        OS: Ubuntu 24.04
        Kernel: 6.8.0
        Kubernetes: v1.30.0
    validations:
      required: false
